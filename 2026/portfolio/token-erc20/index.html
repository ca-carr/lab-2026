<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BEEM161 Token Lab</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>BEEM161 — Token Lab</h1>
        <p class="muted">Connect wallet, load the token, transfer, and burn.</p>
      </header>

      <section class="card">
        <h2>1) Wallet</h2>
        <div class="row">
          <button id="btnConnect">Connect MetaMask</button>
          <button id="btnSwitchSepolia" class="secondary">Switch to Sepolia</button>
          <button id="btnRefresh" class="secondary">Refresh</button>
        </div>

        <div class="kv">
          <div><span class="k">Network </span><span id="network" class="v">—</span></div>
          <div><span class="k">Account </span><span id="account" class="v">—</span></div>
        </div>

        <p id="walletMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>2) Token</h2>

        <label class="label">
          Contract address (BEEM161)
          <input id="tokenAddress" placeholder="0x..." />
        </label>

        <p class="muted">
          <a id="explorerLink" href="#" target="_blank" rel="noreferrer">View on Sepolia Etherscan</a>
        </p>


        <div class="row">
          <button id="btnLoadToken" class="secondary">Load Token</button>
        </div>

        <div class="kv">
          <div><span class="k">Name </span><span id="tName" class="v">—</span></div>
          <div><span class="k">Symbol </span><span id="tSymbol" class="v">—</span></div>
          <div><span class="k">Decimals </span><span id="tDecimals" class="v">—</span></div>
          <div><span class="k">Total Supply </span><span id="tSupply" class="v">—</span></div>
          <div><span class="k">My Balance </span><span id="tBalance" class="v">—</span></div>
          <div><span class="k">Paused? </span><span id="tPaused" class="v">—</span></div>
        </div>

        <p id="tokenMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>3) Transfer</h2>

        <label class="label">
          To
          <input id="toAddress" placeholder="0xRecipient..." />
        </label>

        <label class="label">
          Amount
          <input id="amount" placeholder="e.g. 25" />
        </label>

        <div class="row">
          <button id="btnTransfer">Send Transfer</button>
        </div>

        <p id="txMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>4) Burn</h2>

        <label class="label">
          Amount (will be destroyed)
          <input id="burnAmount" placeholder="e.g. 5" />
        </label>

        <div class="row">
          <button id="btnBurn" class="secondary">Burn</button>
        </div>

        <p id="burnMsg" class="muted"></p>
      </section>

      <footer class="footer">
        <a href="../">← Back to portfolio</a>
        &nbsp;|&nbsp;
        <a href="./admin.html">Admin page →</a>
      </footer>
    </main>

    <script type="module" src="./erc20.js"></script>
  </body>
</html>
