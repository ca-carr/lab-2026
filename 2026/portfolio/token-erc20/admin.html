<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BEEM161 Admin</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>BEEM161 — Admin</h1>
        <p class="muted">Owner actions: pause/unpause and mint.</p>
      </header>

      <section class="card">
        <h2>1) Wallet</h2>
        <div class="row">
          <button id="btnConnect">Connect MetaMask</button>
          <button id="btnSwitchSepolia" class="secondary">Switch to Sepolia</button>
          <button id="btnRefresh" class="secondary">Refresh</button>
        </div>

        <div class="kv">
          <div><span class="k">Network</span><span id="network" class="v">—</span></div>
          <div><span class="k">Account</span><span id="account" class="v">—</span></div>
        </div>

        <p id="walletMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>2) Token</h2>

        <label class="label">
          Contract address (BEEM161)
          <input id="tokenAddress" placeholder="0x..." />
        </label>

        <p class="muted">
            <a id="explorerLink" href="#" target="_blank" rel="noreferrer">View on Sepolia Etherscan</a>
        </p>


        <div class="row">
          <button id="btnLoadToken" class="secondary">Load Token</button>
        </div>

        <div class="kv">
          <div><span class="k">Owner</span><span id="tOwner" class="v">—</span></div>
          <div><span class="k">Am I Owner?</span><span id="tAmOwner" class="v">—</span></div>
          <div><span class="k">Paused?</span><span id="tPaused" class="v">—</span></div>
          <div><span class="k">Total Supply</span><span id="tSupply" class="v">—</span></div>
        </div>

        <p id="tokenMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>3) Pause control (owner only)</h2>
        <div class="row">
          <button id="btnPause">Pause</button>
          <button id="btnUnpause" class="secondary">Unpause</button>
        </div>
        <p id="pauseMsg" class="muted"></p>
      </section>

      <section class="card">
        <h2>4) Mint (owner only)</h2>

        <label class="label">
          To
          <input id="mintTo" placeholder="0xRecipient..." />
        </label>

        <label class="label">
          Amount (human units)
          <input id="mintAmount" placeholder="e.g. 1000" />
        </label>

        <div class="row">
          <button id="btnMint">Mint</button>
        </div>

        <p id="mintMsg" class="muted"></p>
      </section>

      <footer class="footer">
        <a href="./">← Back to token page</a>
        &nbsp;|&nbsp;
        <a href="../">Back to portfolio →</a>
      </footer>
    </main>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
